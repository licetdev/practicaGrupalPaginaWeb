<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Biblioteca</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="body">

  <main class="app">

    <!-- ========== COLUMNA IZQUIERDA: MENÚ ========== -->
    <aside class="menu">
      
      <h3>Mi Biblioteca</h3>

      <h2>Filtros</h2>
      <button>Todos</button>
      <button>Por leer</button>
      <button>Leyendo</button>
      <button>Leídos</button>

      <h2>Acciones</h2>
      <button>Quitar leídos</button>
      <button>Vaciar biblioteca</button>
    </aside>

    <!-- ========== COLUMNA DERECHA ========== -->
    <section class="apartadoDerecho">
      <h2>Mis libros</h2>
      <!-- Formulario para agregar -->
      <div class="formulario">
        <label for="autor">Autor</label>
        <input id="autor" type="text">

        <label for="nombreLibro">Nombre del libro</label>
        <input id="nombreLibro" type="text">

        <select>
          <option>Por leer</option>
          <option>Leyendo</option>
          <option>Leído</option>
        </select>

        <button>Agregar</button>
      </div>

      <!-- Mensaje si no hay libros -->
      <div class="mensaje-vacio">
        Aún no hay libros. ¡Agrega uno arriba para ver los apartados!
      </div>

      <!-- Los dos apartados -->
      <div class="apartados">

        <!-- APARTADO 1: FILTRAR -->
        <div class="apartado">
          <h2>Filtrar agregados</h2>
          <div class="botones-filtro">
            <button>Todos</button>
            <button>Por leer</button>
            <button>Leyendo</button>
            <button>Leídos</button>
          </div>
        </div>

        <!-- APARTADO 2: LISTAR -->
        <div class="apartado">
          <h2>Listar libros</h2>
          <div class="listaLibros"></div>
        </div></div>

    </section>

  </main>

  <script src="/js/script.js"></script>
</body>
</html>
